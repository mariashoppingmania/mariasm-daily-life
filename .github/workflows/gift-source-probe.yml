name: Gift Source Probe
on:
  push:
    paths:
      - .github/workflows/gift-source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe independently photographed gift catalogues
        shell: bash
        run: |
          cat > /tmp/probe.mjs <<'NODE'
          const sources=[["hisgifts.it","en/collections/male"],["latestbuy.it","en/collections/gadgets-fun-frivolous"],["numskull.com","collections/all-products"],["32conceptstore.it","collections/gadget-tech-regalo"],["32conceptstore.it","collections/idee-regalo"],["getdigital.eu","collections/all"],["oddlyepic.com","collections/all"],["kikkerland.com","collections/all"],["www.orbitkey.com","collections/all"],["www.nativeunion.com","collections/all"],["www.cabaia.com","collections/all"],["www.puravidabracelets.com","collections/all"],["www.rosefieldwatches.com","collections/all"],["ohhdeer.com","collections/all"],["www.theoodie.com","collections/all"],["www.divoom.com","collections/all"],["www.stanley1913.com","collections/all"]];
          await Promise.all(sources.map(async ([host,p])=>{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),18000);try{const u='https://'+host+'/'+p+'/products.json?limit=250';const r=await fetch(u,{signal:ctrl.signal});const j=await r.json();const ps=j.products||[];console.log(JSON.stringify({site:host+'/'+p,status:r.status,count:ps.length,cats:[...new Set(ps.map(x=>x.product_type))].slice(0,18),sample:ps.slice(0,12).map(x=>x.title)}))}catch(e){console.log(JSON.stringify({site:host+'/'+p,error:String(e).slice(0,110)}))}finally{clearTimeout(timer)}}));
          NODE
          node /tmp/probe.mjs
