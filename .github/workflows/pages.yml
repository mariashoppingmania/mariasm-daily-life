name: Publish MariaSM to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get website source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract complete source project
        run: |
          unzip -q mariasm-site.zip -d source
          cp -R updates/. source/mariasm-site/
      - name: Prepare Python for YouTube upload discovery
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-channel metadata reader
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Refresh newest public Videos and Shorts
        run: node source/mariasm-site/scripts/refresh-youtube.mjs
      - name: Build static pages
        run: node source/mariasm-site/scripts/build.mjs
      - name: Add Christmas decorations and remove Halloween
        run: node source/mariasm-site/scripts/postbuild-christmas.mjs
      - name: Add Winter Style 2027 guide and home link
        run: node source/mariasm-site/scripts/postbuild-winter.mjs
      - name: Build three accessory ateliers and luxury jewellery edit
        run: node source/mariasm-site/scripts/postbuild-accessory-trio.mjs
      - name: Expand six editorial ateliers and the luxury jewellery selection
        run: node source/mariasm-site/scripts/postbuild-editorial-expansion.mjs
      - name: Refine photos, historical guides, home cards and atelier menu
        run: node source/mariasm-site/scripts/postbuild-curation.mjs
      - name: Extend Murano history, glassmaking and verified product photography
        run: node source/mariasm-site/scripts/postbuild-murano-deep-dive.mjs
      - name: Repair Murano types, historical photographs and shopping images
        run: node source/mariasm-site/scripts/postbuild-murano-photo-repair.mjs
      - name: Align eight Murano technique cards and guarantee illustrations
        run: node source/mariasm-site/scripts/postbuild-murano-types-layout.mjs
      - name: Rebuild Fine Plates, Ceramics and Glassware with verified photography
        run: node source/mariasm-site/scripts/postbuild-fine-tableware-photo-audit.mjs
      - name: Verify jewellery product photography and remove AI shop placeholders
        run: node source/mariasm-site/scripts/postbuild-jewellery-verified-photos.mjs
      - name: Restore high jewellery authentic photographs and official collection links
        run: node source/mariasm-site/scripts/postbuild-high-jewellery-real-photos.mjs
      - name: Create Hair Atelier and integrate with site menus
        run: node source/mariasm-site/scripts/postbuild-hair-atelier.mjs
      - name: Build photograph-verified Hair Atelier product catalogue
        run: node source/mariasm-site/scripts/postbuild-hair-shop.mjs
      - name: Audit Hair Shop photographs and actual product files
        run: |
          PAGE=source/mariasm-site/docs/hair/index.html
          test -s "$PAGE"
          grep -q 'id="products"' "$PAGE"
          PHOTO_COUNT=$(grep -o 'class="hair-shop-card"' "$PAGE" | wc -l | tr -d ' ')
          echo "Hair Shop verified photographed products: $PHOTO_COUNT"
          if [ "$PHOTO_COUNT" -lt 12 ]; then
            echo "::warning::Only $PHOTO_COUNT product photos were verified; more catalogue sources need access."
          fi
      - name: Verify Hair Atelier and homepage navigation
        run: |
          test -s source/mariasm-site/docs/hair/index.html
          grep -q 'id="cuts"' source/mariasm-site/docs/hair/index.html
          grep -q 'id="colour"' source/mariasm-site/docs/hair/index.html
          grep -q 'id="hair-atelier-home-feature"' source/mariasm-site/docs/index.html
          grep -q 'class="hair-nav-added"' source/mariasm-site/docs/index.html
      - name: Verify homepage and six editorial ateliers
        run: |
          test -s source/mariasm-site/docs/index.html
          for page in belts-suspenders scarves gloves home-utensils venetian-glass fine-tableware; do
            test -s "source/mariasm-site/docs/$page/index.html"
            grep -q 'id="mariasm-quality"' "source/mariasm-site/docs/$page/index.html"
            grep -q 'id="ma-filter-query"' "source/mariasm-site/docs/$page/index.html"
          done
          grep -q 'id="mariasm-craft-ateliers"' source/mariasm-site/docs/index.html
          BELTS_PAGE=source/mariasm-site/docs/belts-suspenders/index.html
          PRODUCT_COUNT=$(grep -o 'class="ma-product"' "$BELTS_PAGE" | wc -l | tr -d ' ')
          HISTORY_COUNT=$(grep -o 'class="ma-era-item"' "$BELTS_PAGE" | wc -l | tr -d ' ')
          TYPE_COUNT=$(grep -o 'class="ma-type"' "$BELTS_PAGE" | wc -l | tr -d ' ')
          echo "Belts Atelier published: $PRODUCT_COUNT photographic product cards, $HISTORY_COUNT history chapters, $TYPE_COUNT style guides"
          # Retailer image CDNs occasionally block downloads: do not block the whole site
          # because two otherwise valid product photographs were unavailable.
          test "$PRODUCT_COUNT" -ge 1
          if [ "$PRODUCT_COUNT" -lt 12 ]; then
            echo "::warning::Only $PRODUCT_COUNT belt products have photograph sources; investigate retailer image availability separately."
          fi
          test "$HISTORY_COUNT" -eq 7
          test "$TYPE_COUNT" -eq 8
          grep -q 'id="ma-filter-kind"' "$BELTS_PAGE"
      - name: Assert jewellery products and luxury collections are not lost
        run: |
          PAGE=source/mariasm-site/docs/jewellery/index.html
          test -s "$PAGE"
          PRODUCT_COUNT=$(grep -o 'class="ac-product"' "$PAGE" | wc -l | tr -d ' ')
          BVLGARI_COUNT=$(grep -o 'class="ms-jewel-card"' "$PAGE" | wc -l | tr -d ' ')
          CARTIER_COUNT=$(grep -o 'class="ms-jewel-boutique"' "$PAGE" | wc -l | tr -d ' ')
          echo "Jewellery inventory: $PRODUCT_COUNT regular, $BVLGARI_COUNT Bvlgari, $CARTIER_COUNT Cartier collections"
          test "$PRODUCT_COUNT" -eq 8
          test "$BVLGARI_COUNT" -ge 6
          test "$CARTIER_COUNT" -eq 3
          ! grep -q 'Illustrative jewellery icon' "$PAGE"
      - name: Build Skincare and Oral Care ateliers with photo-verified shop products
        run: node source/mariasm-site/scripts/postbuild-wellness-ateliers.mjs
      - name: Validate skincare and oral-care navigation and assets
        run: |
          for slug in skin-care oral-care; do
            test -s "source/mariasm-site/docs/$slug/index.html"
            grep -q 'id="guide"' "source/mariasm-site/docs/$slug/index.html"
            grep -q 'id="shop"' "source/mariasm-site/docs/$slug/index.html"
            grep -q 'id="faq"' "source/mariasm-site/docs/$slug/index.html"
          done
          grep -q 'id="mariasm-skincare-oral-home"' source/mariasm-site/docs/index.html
          grep -q 'class="ms-new-beauty-link"' source/mariasm-site/docs/index.html
          grep -q 'skin-care/index.html' source/mariasm-site/docs/index.html
          grep -q 'oral-care/index.html' source/mariasm-site/docs/index.html
      - name: Add body depilation, technique and verified-photo shop to Skincare Atelier
        run: node source/mariasm-site/scripts/postbuild-skin-depilation.mjs
      - name: Audit body hair removal page and image files
        run: |
          PAGE=source/mariasm-site/docs/skin-care/index.html
          test -s "$PAGE"
          grep -q 'id="depilation"' "$PAGE"
          grep -q 'id="hr-methods"' "$PAGE"
          grep -q 'id="hr-technique"' "$PAGE"
          grep -q 'id="hr-shop"' "$PAGE"
          grep -q 'id="hr-faq"' "$PAGE"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const page=fs.readFileSync('source/mariasm-site/docs/skin-care/index.html','utf8');
          const chunk=page.split('<section id="depilation">')[1]?.split('</section>')[0]||'';
          const refs=[...chunk.matchAll(/<img[^>]*src="(assets\/hair-removal\/[^"]+)"/g)].map(m=>m[1]);
          for(const ref of refs){
            const file=path.join('source/mariasm-site/docs/skin-care',ref);
            if(!fs.existsSync(file)||fs.statSync(file).size<4000)throw new Error('Missing or invalid product photo: '+ref);
          }
          console.log('Depilation image file audit passed:',refs.length,'verified local photographs');
          JS
      - name: Add Sun Care and SPF guide with product photography
        run: node source/mariasm-site/scripts/postbuild-skin-sun-care.mjs
      - name: Verify sun care and depilation are visible and linked
        run: |
          PAGE=source/mariasm-site/docs/skin-care/index.html
          grep -q 'id="depilation"' "$PAGE"
          grep -q 'id="sun-care"' "$PAGE"
          grep -q 'id="sun-shop"' "$PAGE"
          grep -q 'href="#depilation"' "$PAGE"
          grep -q 'href="#sun-care"' "$PAGE"
      - name: Build Eyewear editorial and photo-verified product shop in Hats Atelier
        run: node source/mariasm-site/scripts/postbuild-eyewear-hats.mjs
      - name: Validate eyewear section and local images
        run: |
          PAGE=source/mariasm-site/docs/hats/index.html
          test -s "$PAGE"
          grep -q 'id="eyewear-guide"' "$PAGE"
          grep -q 'id="eyewear-types"' "$PAGE"
          grep -q 'id="eyewear-lenses"' "$PAGE"
          grep -q 'id="eyewear-shop"' "$PAGE"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const html=fs.readFileSync('source/mariasm-site/docs/hats/index.html','utf8');
          const chunk=html.split('<section id="eyewear-guide">')[1]||'';
          const sources=[...chunk.matchAll(/src="(assets\/eyewear\/[^"]+)"/g)].map(x=>x[1]);
          for(const rel of sources){
            const full=path.join('source/mariasm-site/docs/hats',rel);
            if(!fs.existsSync(full)||fs.statSync(full).size<4000)throw Error('Eyewear image missing: '+rel);
          }
          const products=[...chunk.matchAll(/<article class="ew-product">([\s\S]*?)<\/article>/g)].map(x=>x[1]);
          if(products.length<10)throw Error('Not enough specific eyewear products: '+products.length);
          if(sources.length!==products.length)throw Error('Eyewear product/photo count mismatch');
          if(products.some(x=>/<h3>[^<]*(mystery|surprise|blind box|random)/i.test(x)))throw Error('Mystery or placeholder sunglasses remain');
          const brands=new Set(products.map(x=>x.match(/<small>([^<]+)<\/small>/)?.[1]).filter(Boolean));
          if(brands.size<2)throw Error('Eyewear choices not diversified by brand');
          console.log('Verified eyewear product images:',sources.length,'across',brands.size,'brands, no mystery product photos');
          JS
      - name: Expand Swimwear and Lingerie editorial with photo-audited products
        run: node source/mariasm-site/scripts/postbuild-swimwear-lingerie-expansion.mjs
      - name: Validate expanded Swimwear collections and original product photos
        run: |
          PAGE=source/mariasm-site/docs/swimwear-lingerie/index.html
          test -s "$PAGE"
          grep -q 'id="swim-edit-2026"' "$PAGE"
          for section in swx-styles swx-bikini swx-bottoms swx-onepiece swx-accessories swx-lingerie; do
            grep -q "id=\"$section\"" "$PAGE"
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='source/mariasm-site/docs/swimwear-lingerie';
          const html=fs.readFileSync(path.join(root,'index.html'),'utf8');
          const edit=html.split('<section id="swim-edit-2026">')[1]||'';
          const files=[...edit.matchAll(/src="(assets\/expanded-shop\/[^"]+)"/g)].map(m=>m[1]);
          for(const file of files){
            const full=path.join(root,file);
            if(!fs.existsSync(full)||fs.statSync(full).size<4500)throw Error('Missing or truncated original product photo: '+file);
          }
          console.log('Swimwear and lingerie photograph audit:',files.length,'valid locally hosted product photos');
          JS
      - name: Replace repetitive swimwear editorial images with authentic product photos
        run: node source/mariasm-site/scripts/postbuild-swimwear-authentic-editorial-fix.mjs
      - name: Validate exact product photo replacements
        run: |
          PAGE=source/mariasm-site/docs/swimwear-lingerie/index.html
          grep -q 'id="ms-authentic-swim-product-css"' "$PAGE"
          grep -q 'class="ms-auth-photo"' "$PAGE"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='source/mariasm-site/docs/swimwear-lingerie';
          const page=fs.readFileSync(path.join(root,'index.html'),'utf8');
          const photos=[...page.matchAll(/<img class="ms-auth-photo"[^>]*src="([^"]+)"/g)].map(m=>m[1]);
          if(photos.length<1)throw Error('No authentic replacements');
          if(new Set(photos).size!==photos.length)throw Error('Duplicate editorial replacement images');
          for(const photo of photos){
            const local=path.join(root,photo);
            if(!fs.existsSync(local)||fs.statSync(local).size<4000)throw Error('Missing real product image: '+photo);
          }
          console.log('Authentic editorial cards audited:',photos.length);
          JS
      - name: Fix two remaining unavailable swimwear photographs
        run: node source/mariasm-site/scripts/postbuild-swimwear-last-missing-photos.mjs
      - name: Assert missing swimsuit product photos have real matching replacements
        run: |
          PAGE=source/mariasm-site/docs/swimwear-lingerie/index.html
          grep -q 'data-replaced-editorial="High-Waist Bikini Bottoms"' "$PAGE"
          grep -q 'data-replaced-editorial="Bella Underwire Bikini Set Sea Blue"' "$PAGE"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir='source/mariasm-site/docs/swimwear-lingerie';
          const html=fs.readFileSync(path.join(dir,'index.html'),'utf8');
          const cards=[...html.matchAll(/<article class="ms-authentic-swim-product"[^>]*data-replaced-editorial="([^"]+)"[\s\S]*?<\/article>/g)].filter(x=>/High-Waist Bikini Bottoms|Bella Underwire Bikini Set Sea Blue/.test(x[1]));
          if(cards.length!==2)throw Error('Expected exactly two corrected product cards');
          for(const card of cards){
            const img=card[0].match(/src="([^"]+)"/)?.[1];
            const asset=path.join(dir,img??'');
            if(!img||!fs.existsSync(asset)||fs.statSync(asset).size<4500)throw Error('Invalid replacement product image: '+card[1]);
            if(/IMAGE UNAVAILABLE|image unavailable|ACTUAL PRODUCT IMAGE/.test(card[0]))throw Error('Placeholder persisted: '+card[1]);
            if(!card[0].includes('View this exact product'))throw Error('Matching shopping link missing: '+card[1]);
          }
          console.log('Both missing-photo cards replaced with validated product images');
          JS
      - name: Verify original Maria SM branding remains untouched
        run: |
          ! grep -q 'id="mariasm-anime-logo-installer"' source/mariasm-site/docs/index.html
          ! grep -q 'id="mariasm-anime-logo-installer"' source/mariasm-site/docs/swimwear-lingerie/index.html
          ! grep -q 'id="mariasm-anime-logo-installer"' source/mariasm-site/docs/hats/index.html
      - name: Build Christmas food special with parchment recipes and homepage news
        run: |
          node --check source/mariasm-site/scripts/postbuild-christmas-food-special.mjs
          node source/mariasm-site/scripts/postbuild-christmas-food-special.mjs
      - name: Correct Neapolitan Roccocò and enrich Christmas culture and countdown
        run: |
          node --check source/mariasm-site/scripts/postbuild-christmas-history-counter.mjs
          node source/mariasm-site/scripts/postbuild-christmas-history-counter.mjs
      - name: Audit festive history, counter, authentic Roccocò photograph
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base='source/mariasm-site/docs/christmas-food/';
          const html=fs.readFileSync(base+'index.html','utf8');
          const source=fs.readFileSync(base+'photo-sources.json','utf8');
          for(const id of ['ms-xmas-history','ms-xmas-countdown','ms-xmas-counter-js','ms-roccoco-credit']){
            if(!html.includes('id="'+id+'"'))throw Error('Missing Christmas feature: '+id);
          }
          const photo=fs.readFileSync(base+'photos/roccoco-napoli-christmas-biscuits.jpg');
          if(photo.length<16000||photo[0]!==255||photo[1]!==216)throw Error('Invalid Roccocò photograph');
          const card=html.match(/<article class="recipe"[^>]*>[\s\S]*?<h3>Roccocò<\/h3>[\s\S]*?<\/article>/)?.[0];
          if(!card||!card.includes('src="photos/roccoco-napoli-christmas-biscuits.jpg"'))throw Error('Wrong Roccocò photo card');
          if(!source.includes('Rollopack'))throw Error('Roccocò photographer attribution missing');
          console.log('Verified authentic Roccocò image, cultural history and working countdown markup.');
          JS
      - name: Audit Christmas food special, recipe collection and navigation
        run: |
          PAGE=source/mariasm-site/docs/christmas-food/index.html
          HOME=source/mariasm-site/docs/index.html
          test -s "$PAGE"
          grep -q 'id="italy"' "$PAGE"
          grep -q 'id="philippines"' "$PAGE"
          grep -q 'id="world"' "$PAGE"
          grep -q 'id="holiday-planner"' "$PAGE"
          grep -q 'id="mariasm-christmas-food-news"' "$HOME"
          grep -q 'href="christmas-food/index.html"' "$HOME"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir='source/mariasm-site/docs/christmas-food';
          const html=fs.readFileSync(path.join(dir,'index.html'),'utf8');
          const recipes=[...html.matchAll(/<article class="recipe" data-kind="/g)];
          const all=JSON.parse(fs.readFileSync('source/mariasm-site/content/christmas-food-recipes.json','utf8'));
          if(recipes.length!==all.length)throw Error('Recipe cards missing: '+recipes.length+' of '+all.length);
          const urls=[...html.matchAll(/<img[^>]+src="(photos\/[^"]+)"/g)].map(x=>x[1]);
          if(urls.length!==recipes.length)throw Error('Recipe without photo: '+urls.length+' photos for '+recipes.length+' recipes');
          for(const url of urls){
             const filename=path.join(dir,url);
             if(!fs.existsSync(filename)||fs.statSync(filename).size<5000)throw Error('Missing Christmas dish photo: '+url);
          }
          if(!html.includes('Pork Morcon'))throw Error('Pork Morcon recipe missing');
          const home=fs.readFileSync('source/mariasm-site/docs/index.html','utf8');
          if(home.includes('mariasm-anime-logo-installer'))throw Error('Original Maria SM logo should remain in place');
          console.log('Christmas special validated:',recipes.length,'illustrated recipe cards and',urls.length,'verified local food images');
          JS
      - name: Check pages and local links
        run: node source/mariasm-site/scripts/check.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/mariasm-site/docs
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5

